<section class="failure-screen" aria-live="assertive">
  <div class="win98-window" [class.is-visible]="hasVideo" aria-label="System video message window">
    <div class="win98-titlebar">
      <span class="window-icon" aria-hidden="true"></span>
      <span class="window-title">System Message</span>
      <div class="window-controls" aria-hidden="true">
        <span class="control-button">_</span>
        <span class="control-button">□</span>
      </div>
    </div>
    <div class="win98-body">
      <video
        #magicVideo
        class="magic-video"
        [src]="videoSource"
        playsinline
        muted
        loop
        (loadeddata)="onVideoReady()"
        (error)="onVideoError()"
      ></video>
    </div>
  </div>

  @if (!hasVideo) {
    <div class="failure-copy">
      <div class="alert-line">PARK SECURITY OVERRIDE</div>
      <h2>
        <span>YOU DID NOT SAY</span>
      </h2>
      <div class="scream" aria-label="A repeated system failure scream">
        @for (letter of screamLetters; track letter) {
          <span [style.--i]="letter">THE MAGIC WORD</span>
        }
      </div>
    </div>
  }
</section>
